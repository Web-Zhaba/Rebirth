name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # The portal builds, checked against each portal's archive rules (publish.yml makes the release zips). The
      # Yandex one is uploaded as an artifact whose zip is ready for the developer console (index.html at its root).
      - name: Build for the portals
        run: |
          npx vite build --mode yandex --outDir dist-yandex && node scripts/pack.mjs yandex dist-yandex
          npx vite build --mode crazygames --outDir dist-crazygames && node scripts/pack.mjs crazygames dist-crazygames
          node scripts/pack.mjs itch dist

      - name: Upload Yandex Games archive
        uses: actions/upload-artifact@v4
        with:
          name: rebirth-yandex-${{ github.sha }}
          path: dist-yandex/
          if-no-files-found: error
          retention-days: 14
