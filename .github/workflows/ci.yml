name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_GD_GAME_ID: ${{ vars.GD_GAME_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # Every portal build, checked against its portal's archive rules and for other portals' SDKs (publish.yml
      # makes the release zips). The Yandex one is uploaded as an artifact ready for the developer console.
      - name: Build for the portals
        run: npm run build:portals

      - name: Upload Yandex Games archive
        uses: actions/upload-artifact@v4
        with:
          name: rebirth-yandex-${{ github.sha }}
          path: dist-yandex/
          if-no-files-found: error
          retention-days: 14
