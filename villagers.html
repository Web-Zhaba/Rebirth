<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Rebirth — жители</title>
    <link rel="icon" type="image/svg+xml" href="/rebirth-icon.svg" />
    <!-- Dev-only preview of the villager figures (src/map/villagerModel.ts); not part of the vite build. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dfe4d6; /* --paper */
        font: 14px/1.4 system-ui, sans-serif;
        color: #1e2822; /* --ink */
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      .panel {
        position: fixed;
        top: 12px;
        left: 12px;
        width: min(340px, calc(100vw - 24px));
        padding: 12px 14px;
        background: rgb(233 236 223 / 0.92); /* --paper-raised */
        border-radius: 6px;
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.12);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 17px;
      }
      .hint {
        margin: 0 0 10px;
        color: #38453d; /* --ink-2 */
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      button {
        padding: 6px 10px;
        font: inherit;
        color: inherit;
        background: #e9ecdf;
        border: 1px solid #8f988a; /* --rule-dotted */
        border-radius: 4px;
        cursor: pointer;
      }
      button.on {
        background: #2b352d; /* --moss */
        border-color: #2b352d;
        color: #e9ecdf;
      }
      button.wide {
        margin: 10px 0;
        width: 100%;
      }
      details {
        margin-top: 10px;
      }
      summary {
        cursor: pointer;
        color: #38453d; /* --ink-2 */
      }
      .list {
        margin: 6px 0 0;
        padding-left: 20px;
        max-height: 40vh;
        overflow: auto;
        font-variant-numeric: tabular-nums;
      }
      .fail {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/engine/spike/villagers.ts"></script>
  </body>
</html>
